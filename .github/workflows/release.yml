name: automated release

on:
  push:
    branches:
      - main # triggers when new commit(s) get pushed or merged to main
    paths:
      - "package.json" # only start if package.json included in the commit(s) to avoid wasting resource usage

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup bun environment
        uses: oven-sh/setup-bun@v2

      - name: install dependencies
        run: bun install

      - name: build userscript
        run: bun run build

      - name: get version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').kumiyui.headers.version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: commit build assets to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
 
          git add -f ./dist/azota_cheat.user.js
          git add -f ./dist/azota_cheat.min.user.js

          git commit -m "chore(release): compile distribution files for ${{ steps.package_version.outputs.version }} [skip ci]" || exit 0
          git push origin main

      - name: create and upload github release assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./dist/azota_cheat.user.js, ./dist/azota_cheat.min.user.js"
          tag: ${{ steps.package_version.outputs.version }}
          name: "${{ steps.package_version.outputs.version }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}